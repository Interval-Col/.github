# Biuman — public contact & locations.
#
# CANONICAL source of truth for Biuman's public contact facts. Same nature and
# same home as `hematologico.yml`: these are PUBLIC facts, the ones printed on
# the website and the door — NOT PHI. It lives in .github, the org's single
# PUBLIC repo, because that is what this repo is for: any surface (the marketing
# site, an app, a report footer) points here instead of copying.
#
# Biuman is the sports-laboratory sibling inside the holding and operates INSIDE
# LCH's facilities, so its address is the same as LCH's Sede Principal Oviedo in
# `hematologico.yml` — Calle 6 Sur # 43A-227. That is not a copy-paste slip:
# check it against that file before "fixing" either one.
#
# Consumers mirror these values rather than importing this file directly:
#   - public-web (marketing site): apps/biuman-web/app/utils/entidad-clinica.ts
# When you change a value here, update the mirror too.
#
# ── Why this file exists ────────────────────────────────────────────────────
# The rebuild plan (RFC 0014 Fase 5) found that LCH had a canonical contact
# source and Biuman had NOTHING, while a marketing site is largely this content.
# The live WordPress site proves the cost: its footer and its event pages
# disagree with each other, and one page links `wa.me/3117497048` — WITHOUT the
# +57 country code, so it is a dead link in production today.
#
# ⚠️ VALUES MARKED `null` ARE HOLES, NOT DEFAULTS. Each one is a fact only the
# clinic can supply. They are written out rather than guessed, because a
# plausible invented opening time is the kind of error nobody catches twice.

brand: biuman

website: "https://biuman.team"

phones:
  # Verified from the live site's own `tel:` and `wa.me` links (2026-08-15
  # capture). The site has NO landline anywhere.
  mobile: "+57 312 538 2342"
  landline: null # ⚠️ HOLE — does Biuman have one, or does it share LCH's 604 444 4200?

whatsapp: "https://wa.me/573125382342"

# Decoded from the footer's Cloudflare email obfuscation — the markup carries no
# plain-text address on any of the 35 captured pages.
email: "movement@biuman.team"

social:
  instagram: "https://www.instagram.com/biuman.team/"
  # ⚠️ HOLE — the live site's footer shows icons for these; confirm the handles
  # before publishing them anywhere.
  facebook: null
  linkedin: null

legal:
  # Both taken from Biuman's OWN legal documents (the privacy notice and the
  # data-processing policy), which state: «La sociedad Biuman S.A.S. identificada
  # con el N.I.T. 901.726.973-6». Not from a registry lookup — from the PDFs the
  # signed consents point at.
  registered_name: "Biuman S.A.S."
  nit: "901.726.973-6"
  # ⚠️ This still points at the LIVE WordPress. The three PDFs were re-hosted in
  # the new site (public-web#381) but that is not deployed yet; the day it is,
  # this becomes `https://biuman.team/politicas` served by the new app and the
  # PDFs by `/legal/`. The URL does not change — the server behind it does.
  #
  # 🛑 The documents are dated 2023. Whether they are still the current versions
  # is a confirmation the clinic owes; nobody has checked.
  privacy_policy_url: "https://biuman.team/politicas/"

locations:
  - name: "Sede Biuman"
    # Same building as LCH Sede Principal Oviedo — see the note at the top.
    # `biuman-kb` §7.3 resolved it on 2026-07-15: «C.C. Oviedo, Local 196 —
    # Calle 6Sur # 43A-227, en las instalaciones del LCH», confirmed by the
    # Biuman team. Same local as LCH's, because they share the space.
    unit: "Local 196"
    address: "Calle 6 Sur # 43A-227"
    neighbourhood: "El Poblado"
    city: "Medellín"
    map: "https://www.google.com/maps/place/Cl.+6+Sur+%23+43A+-+227,+El+Poblado,+Medell%C3%ADn,+Antioquia/@6.2002084,-75.5784374,17z/"
    hours:
      # ⚠️ STILL A HOLE, and one that looks answered but is not.
      #
      # `biuman-kb` does list hours for this address — but they are LCH's LAB
      # hours (sample collection 6:00–16:00, results 6:00–17:00), byte-identical
      # to the ones in `hematologico.yml`. Biuman does sports-medicine
      # appointments booked over WhatsApp, not walk-in sample collection.
      # Publishing the lab's hours as Biuman's would be the kind of
      # plausible-but-wrong value nobody rechecks.
      # ⇒ These come from the clinic or they stay null.
      weekdays: null # lunes a viernes
      saturday: null
      sunday: null

  # ✅ ANSWERED — ONE sede. `biuman-kb` §7.3 (2026-07-15, confirmed by the Biuman
  # team) states it plainly, and adds the counter-fact: the old address
  # «Cra 43C # 5-33, El Poblado (Sede Patio Bonito)» is NOT Biuman's — it
  # survives in old fiches, on the website and on the maps.

# ── Known-wrong data OUT IN THE WORLD (not fixable from this file) ───────────
#
# 🔴 Google Maps and Waze still list `Cra 43C # 5-33` for Biuman. `biuman-kb`
# §7.3 says plainly that it is NOT the sede. Until someone claims the listing and corrects it, the
# most common way a patient looks up the address sends them to the wrong place —
# and no amount of correctness in this repo fixes that.
