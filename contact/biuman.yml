# Biuman — public contact & locations.
#
# CANONICAL source of truth for Biuman's public contact facts. Same nature and
# same home as `hematologico.yml`: these are PUBLIC facts, the ones printed on
# the website and the door — NOT PHI. It lives in .github, the org's single
# PUBLIC repo, because that is what this repo is for: any surface (the marketing
# site, an app, a report footer) points here instead of copying.
#
# Biuman is the sports-laboratory sibling inside the holding and operates INSIDE
# LCH's facilities, so its address is the same as LCH's Sede Principal Oviedo in
# `hematologico.yml` — Calle 6 Sur # 43A-227. That is not a copy-paste slip:
# check it against that file before "fixing" either one.
#
# Consumers mirror these values rather than importing this file directly:
#   - public-web (marketing site): apps/biuman-web/app/utils/entidad-clinica.ts
# When you change a value here, update the mirror too.
#
# ── Why this file exists ────────────────────────────────────────────────────
# The rebuild plan (RFC 0014 Fase 5) found that LCH had a canonical contact
# source and Biuman had NOTHING, while a marketing site is largely this content.
# The live WordPress site proves the cost: its footer and its event pages
# disagree with each other, and one page links `wa.me/3117497048` — WITHOUT the
# +57 country code, so it is a dead link in production today.
#
# ⚠️ VALUES MARKED `null` ARE HOLES, NOT DEFAULTS. Each one is a fact only the
# clinic can supply. They are written out rather than guessed, because a
# plausible invented opening time is the kind of error nobody catches twice.

