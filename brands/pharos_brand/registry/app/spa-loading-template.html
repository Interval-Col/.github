<!--
  Pháros splash — registry/app/spa-loading-template.html

  Nuxt 4 inlines this file into the HTML of every `ssr:false` app, inside
  `<div id="__nuxt-loader">`, and removes that node on `app:suspense:resolve`.
  So it paints BEFORE any JS loads and goes away on its own once the app is ready.
  No per-app code is needed: having the file in `app/` is enough.

  Why it exists: a Pháros app resolves the session (an identity call) before its
  first paint. Until that answers, a SPA has nothing to show, and the person sees a
  white page with no explanation.

  🔴 The WATCHDOG is not decoration. A splash without it would only swap the white
  page for a spinner that never ends. If the app has not arrived after
  `PHAROS_SPLASH_SLOW_MS`, it says so and offers «Reintentar».

  The mark is the real horizontal logo (`pharos-horizontal-*.svg`, BRAND.md §2): the
  «Pháros» wordmark plus the pilot light above the P, at the logo's own coordinates
  in AppLogo's navbar proportions (viewBox cropped to the ink so the mark centres
  over the sublabel).
  The pilot light is the only thing that moves: it pulses and casts a lighthouse
  beam that sweeps side to side. Each time the beam points at the viewer, the light
  flashes. Everything stops under `prefers-reduced-motion`.

  Rules: self-contained. The app's CSS `<link>` is in `<head>`, so the mark tokens
  (`--pharos-burgundy`, `--pharos-red`) are already defined; their fallbacks are the
  same brand values. The `.dark` / `.theme-*` classes are set by JS that has not run
  yet, so light/dark follows the OS (`color-scheme` + system colors).
  Copied VERBATIM by `sync-pharos-registry.sh`: change it here, never in the app.
-->
<style>
  #__nuxt-loader .pharos-splash {
    --ps-red: var(--pharos-red, rgb(228 0 43));
    --ps-wordmark: var(--pharos-burgundy, rgb(120 47 64));
    --ps-w: min(16rem, 64vw);
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    display: grid;
    place-items: center;
    overflow: hidden;
    color-scheme: light dark;
    background: Canvas;
    color: CanvasText;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    /* pharos-horizontal-dark.svg: the wordmark goes white on dark surfaces. */
    #__nuxt-loader .pharos-splash { --ps-wordmark: CanvasText; }
  }
  #__nuxt-loader .pharos-splash__inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding: 1.5rem;
    text-align: center;
  }

  /* ── The mark: wordmark SVG + the pilot light at the SVG's coordinates ─────── */
  #__nuxt-loader .pharos-splash__mark {
    position: relative;
    width: var(--ps-w);
    aspect-ratio: 204 / 90;
  }
  #__nuxt-loader .pharos-splash__wordmark {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  #__nuxt-loader .pharos-splash__wordmark text {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-size: 64px;
    font-weight: 400;
    letter-spacing: -0.01em;
    fill: var(--ps-wordmark);
  }
  /* Pilot light: AppLogo's NAVBAR proportions (cx=22 cy=9.5 r=3.5 at 36px), the logo
     every app shows in its sidebar, scaled to this 64px wordmark → cx=35.3 cy=16.7
     r=6.2. ⚠️ Not the .svg files' cy=24.7: those seat the light lower, and the eye
     that knows the apps reads it as misplaced. viewBox cropped to the ink:
     "10 8 204 90". */
  #__nuxt-loader .pharos-splash__beacon {
    position: absolute;
    left: calc((35.3 - 10) / 204 * 100%);
    top: calc((16.7 - 8) / 90 * 100%);
    width: 0;
    height: 0;
  }
  #__nuxt-loader .pharos-splash__light,
  #__nuxt-loader .pharos-splash__halo {
    position: absolute;
    left: 0;
    top: 0;
    width: calc(var(--ps-w) * 12.4 / 204);
    aspect-ratio: 1;
    border-radius: 9999px;
    translate: -50% -50%;
  }
  #__nuxt-loader .pharos-splash__light {
    z-index: 3;
    background: var(--ps-red);
    animation: pharos-splash-flash 3s ease-out infinite;
  }
  #__nuxt-loader .pharos-splash__halo {
    z-index: 2;
    border: 2px solid var(--ps-red);
    opacity: 0;
    animation: pharos-splash-halo 3s ease-out infinite;
  }
  #__nuxt-loader .pharos-splash__halo--late { animation-delay: 0.9s; }

  /* The beam: a cone from the light, sweeping side to side like a turning lantern.
     scaleX 1 → -1 → 1; it crosses 0 (pointing at the viewer) every 3 s, on the beat
     of the flash. Behind the wordmark (z-index 0) so the name stays legible. */
  #__nuxt-loader .pharos-splash__beam {
    position: absolute;
    z-index: 0;
    left: 0;
    top: 0;
    width: 60vw;
    height: calc(var(--ps-w) * 1.2);
    translate: 0 -50%;
    transform-origin: 0 50%;
    clip-path: polygon(0 48%, 100% 0, 100% 100%, 0 52%);
    background: linear-gradient(
      90deg,
      color-mix(in oklab, var(--ps-red) 55%, transparent) 0%,
      color-mix(in oklab, var(--ps-red) 18%, transparent) 45%,
      transparent 100%
    );
    animation: pharos-splash-sweep 6s ease-in-out -1.5s infinite;
  }

  #__nuxt-loader .pharos-splash__sub {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  #__nuxt-loader .pharos-splash__sub:empty { display: none; }
  #__nuxt-loader .pharos-splash__msg {
    margin: 1rem 0 0;
    font-size: 0.875rem;
    opacity: 0.65;
    max-width: 20rem;
  }
  #__nuxt-loader .pharos-splash__retry {
    margin-top: 0.25rem;
    padding: 0.5rem 1rem;
    border: 1px solid color-mix(in oklab, CanvasText 25%, transparent);
    border-radius: 0.5rem;
    background: Canvas;
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
    cursor: pointer;
  }
  #__nuxt-loader .pharos-splash__retry:hover {
    background: color-mix(in oklab, CanvasText 8%, Canvas);
  }
  #__nuxt-loader .pharos-splash__retry:focus-visible {
    outline: 2px solid var(--ring, Highlight);
    outline-offset: 2px;
  }
  #__nuxt-loader .pharos-splash__retry[hidden] { display: none; }

  @keyframes pharos-splash-flash {
    0% {
      scale: 1.6;
      box-shadow:
        0 0 calc(var(--ps-w) * 0.08) calc(var(--ps-w) * 0.03) color-mix(in oklab, var(--ps-red) 70%, transparent),
        0 0 calc(var(--ps-w) * 0.22) calc(var(--ps-w) * 0.08) color-mix(in oklab, var(--ps-red) 35%, transparent);
    }
    45%, 100% {
      scale: 1;
      box-shadow:
        0 0 calc(var(--ps-w) * 0.025) 0 color-mix(in oklab, var(--ps-red) 45%, transparent),
        0 0 0 0 transparent;
    }
  }
  @keyframes pharos-splash-halo {
    0% { scale: 1; opacity: 0.7; }
    100% { scale: 7; opacity: 0; }
  }
  @keyframes pharos-splash-sweep {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(-1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #__nuxt-loader .pharos-splash__light,
    #__nuxt-loader .pharos-splash__halo,
    #__nuxt-loader .pharos-splash__beam { animation: none; }
    #__nuxt-loader .pharos-splash__beam { opacity: 0.5; }
  }
</style>
<div class="pharos-splash" role="status" aria-live="polite">
  <div class="pharos-splash__inner">
    <div class="pharos-splash__mark">
      <span class="pharos-splash__beacon" aria-hidden="true">
        <span class="pharos-splash__beam"></span>
        <span class="pharos-splash__halo"></span>
        <span class="pharos-splash__halo pharos-splash__halo--late"></span>
        <span class="pharos-splash__light"></span>
      </span>
      <svg class="pharos-splash__wordmark" viewBox="10 8 204 90" role="img" aria-label="Pháros">
        <text x="14" y="78">Pháros</text>
      </svg>
    </div>
    <p class="pharos-splash__sub" data-pharos-splash="sub"></p>
    <p class="pharos-splash__msg" data-pharos-splash="msg">Cargando…</p>
    <button type="button" class="pharos-splash__retry" data-pharos-splash="retry" hidden>Reintentar</button>
  </div>
</div>
<script>
  (function () {
    var PHAROS_SPLASH_SLOW_MS = 10000;
    var loader = document.getElementById("__nuxt-loader");
    if (!loader) return;
    var pick = function (k) { return loader.querySelector('[data-pharos-splash="' + k + '"]'); };

    // The app's <title> is already in <head> ("Pháros — Laboratorio", "Pháros · Tecnología").
    // The wordmark already says Pháros, so the sublabel takes only the sub-name.
    var parts = (document.title || "").split(/\s+[—·|-]\s+/);
    if (parts.length > 1) pick("sub").textContent = parts[parts.length - 1];

    var retry = pick("retry");
    retry.addEventListener("click", function () { window.location.reload(); });

    window.setTimeout(function () {
      // Nuxt removes #__nuxt-loader when the app is ready; if it is still in the
      // document, the app did not arrive in time.
      if (!document.body.contains(loader)) return;
      pick("msg").textContent = "Esto está tardando más de lo normal.";
      retry.hidden = false;
      // Breadcrumb for diagnosis: timing only, no session data.
      console.warn("[pharos-splash] la app no terminó de cargar en " + PHAROS_SPLASH_SLOW_MS / 1000 + " s");
    }, PHAROS_SPLASH_SLOW_MS);
  })();
</script>
