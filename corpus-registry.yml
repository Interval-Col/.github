# corpus-registry.yml — which KB feeds which app, and what each app may SERVE.
#
# The one file every KB publisher and every Nerea consumer reads (plan
# pharos-llm-proxy/plans/nerea-con-conocimiento-plan.md, task 1.1). No workflow
# keeps a hardcoded dispatch list again: `kb-publish.yml` asks this file.
#
# Validated by scripts/corpus_registry.py (`validate`), which runs on every PR
# that touches it. 🔔 Merging a change here TELLS the consumers it touches
# (`corpus-registry-changed.yml`): every repo whose live edges differ gets
# `kb-updated`, redeploys with its new grants, and — if `wait` — must pass
# corpus-verify, or the push to main goes red. A mode-only change tells no one.
#    ⚠️ The `kbs:` block is read when a KB BUILDS its index: changing roots,
#    default_status or a KB's audiences here REPUBLISHES that KB (its
#    build-site.yml on main; the bot needs `actions: write`). And wire an app to
#    a new KB (sidecar +
#    corpus-verify `sources:`) BEFORE flipping its edge live here. Parsed by the strict mini-YAML in scripts/corpus_lib.py —
# one level of nesting, inline lists, comments; anything deeper is an error.
#
# 🔴 `audiences` on a consumer decides what that Nerea SERVES, not who can READ
#    the KB. A Claude Project, a clone or GitHub itself sees the whole repo
#    (lch-admin-kb#7): a KB never carries what its repo's readers must not see.

version: 1

# D1 (German, 2026-09-27) — the ONLY audience vocabulary. An article declaring
# anything else fails its KB's build; coercing unknown values to `liderazgo` is
# what hid the customer-service and IT guides until now.
audiences: [publico, staff, servicio-al-cliente, ti, liderazgo]

# ── KBs ──────────────────────────────────────────────────────────────
# How scripts/kb_index.py builds each KB's v5 index:
#   roots           folders indexed (README.md is always an area landing, never an article)
#   recursive       also index sub-folders of each root
#   skip            file stems, or root-relative paths without `.md`, left out
#   url             `site` → /<slug>/ on the KB's reading site · `github` → blob URL
#   default_status  status of an article that declares none
#   liderazgo_areas areas whose articles default to `liderazgo` when they declare no audience
#   audiences       what this KB's articles MAY declare (a subset of D1); outside it, the build fails

kbs:
  - id: biuman-kb
    repo: biuman-kb
    image: biuman-kb-site
    roots: [servicios, protocolos, procesos, comercial, politicas, referencia]
    recursive: false
    skip: []
    url: site
    default_status: vigente
    liderazgo_areas: [comercial, politicas]
    # `publico` added 2026-09-28 (German, Checkpoint 1): Sol may serve Biuman
    # articles on lch.co. Still never inferred — only a `vigente` article that
    # declares `audience: publico` by hand reaches it (kb_index.py).
    audiences: [publico, staff, servicio-al-cliente, liderazgo]

  - id: lch-kb
    repo: lch-kb
    image: lch-kb-site
    roots: [fase-0]
    recursive: false
    skip: [guion-presentacion, derrotero-taller-canario, brief-documentacion-viva]
    url: github
    default_status: borrador
    liderazgo_areas: []
    audiences: [publico, staff, liderazgo]

  - id: lch-admin-kb
    repo: lch-admin-kb
    image: lch-admin-kb-site
    # publicaciones-obligatorias/ holds PDFs and their manifest; proyectos/ is
    # work in flight. Neither is guidance a Nerea should serve.
    roots: [servicio-al-cliente, mesa-de-ayuda-ti, lexico]
    recursive: true
    skip: []
    url: github
    default_status: borrador
    liderazgo_areas: []
    audiences: [staff, servicio-al-cliente, ti, liderazgo]

# ── Consumers ────────────────────────────────────────────────────────
# One row per KB → app edge.
#   app           the app (and its Nerea) that loads this KB
#   repo          where its `repository_dispatch: kb-updated` receiver lives
#   environments  where this edge is live (dispatch refreshes dev; prod refreshes on deploy).
#                 The consumer repo's OWN GitHub environment names: its deploy passes its
#                 `environment` to `corpus_registry.py --environment`, and corpus-verify uses
#                 the same input for secrets AND grants. A name the repo does not use gets
#                 `{}` — Nerea serves nothing, silently. Most repos: development/production;
#                 biuman-lis: dev/prod until its rename (biuman-lis#488).
#   audiences     what this app may SERVE from this KB (D1 grants)
#   mode          how kb-publish treats it:
#                   wait    — dispatch, then wait for the consumer's run to come back green.
#                             A 204 proves nothing (Codex, #70): GitHub accepts a dispatch
#                             with no handler or a failing run.
#                   notify  — dispatch only. Transitional: a consumer that reads the index
#                             but runs no verification (biuman-lis's help panel).
#                   planned — not dispatched: the consumer is not built yet.

consumers:
  - kb: biuman-kb
    app: admission-patient
    repo: admission-patient
    environments: [development]
    audiences: [staff, servicio-al-cliente]
    mode: wait

  - kb: biuman-kb
    app: biuman-lis
    repo: biuman-lis
    environments: [dev, prod]   # its GitHub env names (biuman-lis#488)
    audiences: [staff, liderazgo]
    # `wait` since 2026-09-30 (task 3.5): biuman-lis adopted the shared embedder and
    # runs corpus-verify (biuman-lis#490), and that reached main — where `kb-updated`
    # runs — with the promote biuman-lis#425. Its first real kb-updated on main
    # (run 36722458171, 2026-09-30): corpus-verify V1–V3 PASS. Prod embed done (35 chunks).
    mode: wait

  - kb: lch-kb
    app: lab-qc
    repo: pharos-lis
    environments: [development, production]
    audiences: [staff, liderazgo]   # liderazgo added 2026-09-28 (German, Checkpoint 1)
    # `wait` again since 2026-09-29: lab-qc adopted the shared embedder and runs
    # corpus-verify (pharos-lis#542), and that reached main — where `kb-updated`
    # runs — with the promote pharos-lis#549. Its dev corpus-verify: V1–V3 PASS.
    mode: wait

  - kb: lch-kb
    app: lch-citas
    repo: public-web
    environments: [development]
    audiences: [publico]
    mode: planned   # Sol reads lch-kb once Quality marks a document `publico` (CORPUS_KB_INDEX)

  - kb: lch-admin-kb
    app: admission-patient
    repo: admission-patient
    environments: [development]
    audiences: [staff, servicio-al-cliente]
    mode: wait      # live since 2026-09-28 (admission-patient#535): Nerea answers the portal guide in dev

  - kb: lch-admin-kb
    app: pharos-ti
    repo: pharos-ti
    environments: [development]
    audiences: [staff, servicio-al-cliente, ti]
    # `wait` since 2026-09-29 (task 3.4): Pháros TI adopted the shared embedder and
    # runs corpus-verify after every dev deploy (pharos-ti#79, merged to develop — its
    # DEFAULT branch, where kb-updated runs). Both dev gates are on (TI_CHAT_ENABLED,
    # TI_KB_EMBED_ENABLED). This change is what fires its first real embed.
    mode: wait

# ── Added 2026-09-28 — German's selection at Checkpoint 1 ────────────
# Chosen in the «Audiencias de Nerea» mock-up (claude.ai/artifact/AN7P8jWKTX17bwdewjYC8j).
# All `planned`: no app loads these yet. Each flips to `wait` in the same
# change that wires the KB into that app, so nothing turns red early.
# Cross-brand on purpose (German): Biuman LIS serves LCH knowledge, and Sol
# serves Biuman articles marked `publico`.

  - kb: lch-kb
    app: admission-patient
    repo: admission-patient
    environments: [development]
    audiences: [staff]
    mode: planned

  - kb: lch-admin-kb
    app: lab-qc
    repo: pharos-lis
    environments: [development]
    audiences: [staff, servicio-al-cliente]
    mode: planned

  - kb: lch-kb
    app: biuman-lis
    repo: biuman-lis
    environments: [dev]
    audiences: [staff]
    mode: planned

  - kb: lch-admin-kb
    app: biuman-lis
    repo: biuman-lis
    environments: [dev]
    audiences: [staff, servicio-al-cliente]
    mode: planned

  - kb: biuman-kb
    app: lch-citas
    repo: public-web
    environments: [development]
    audiences: [publico]
    mode: planned

  - kb: lch-admin-kb
    app: finance-lch
    repo: finance-lch
    environments: [development]
    audiences: [staff, servicio-al-cliente, liderazgo]
    mode: planned   # finance-lch keeps its own docs too; its manifest moves off `corpus_app: none` when wired
