# corpus-check — the registry is valid and the corpus scripts pass their tests.
#
# Guards corpus-registry.yml (which KB feeds which app, and what each app may
# SERVE) and the scripts every KB publisher and Nerea consumer runs from here:
# scripts/corpus_*.py, scripts/kb_*.py, H11 in scripts/chat-contract-check.py, and
# scripts/changes_classify.py (the docs-only rule behind changes.yml).
# Plan: pharos-llm-proxy/plans/nerea-con-conocimiento-plan.md, Phase 1.
#
# github-hosted on purpose: this repo is public, so its runs don't count against
# the org's Actions minutes (the tenant repos' checks run self-hosted for that
# reason). Stdlib only: no pip install on the path.

name: corpus-check

on:
  pull_request:
    paths:
      - "corpus-registry.yml"
      - "scripts/corpus_*.py"
      - "scripts/kb_*.py"
      - "scripts/changes_*.py"
      - "scripts/chat-contract-check.py"
      - "tests/corpus/**"
      - ".github/workflows/corpus-check.yml"
      - ".github/workflows/kb-publish.yml"
      - ".github/workflows/corpus-verify.yml"
      - ".github/workflows/changes.yml"
  push:
    branches: [main]
    paths:
      - "corpus-registry.yml"
      - "scripts/corpus_*.py"
      - "scripts/kb_*.py"
      - "scripts/changes_*.py"
      - "scripts/chat-contract-check.py"
      - "tests/corpus/**"

permissions:
  contents: read

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    # 🔴 3.10 is what the org's self-hosted runners ship (jammy), and it is where
    # kb-publish and corpus-verify actually run these scripts. `datetime.UTC`
    # (3.11+) passed here on 3.12 and crashed biuman-kb's first real publish
    # (2026-09-28). Test on the oldest interpreter the scripts meet, too.
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: The registry is valid
        run: |
          python3 scripts/corpus_registry.py validate
          python3 scripts/corpus_registry.py table >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: python3 -m unittest discover -s tests/corpus -v
