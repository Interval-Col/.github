# Reusable: does this change carry code, or only documentation?
#
# So a PR that only edits a plan does not run the backend suite, build the
# frontend and deploy to dev. Measured 2026-09-28: pharos-llm-proxy ran `tests`
# (~2 min) and rebuilt its image, and admission-patient built its frontend
# (~10 min) and deployed dev, for changes that touched only `.md` files.
#
# The rule lives in scripts/changes_classify.py — ONE list for the whole org:
# `*.md`, `docs/`, `plans/`, `LICENSE`. Everything else is code.
#
# Caller:
#
#   jobs:
#     changes:
#       uses: Interval-Col/.github/.github/workflows/changes.yml@main
#     tests:
#       needs: changes
#       # 🔑 `!= 'false'`, never `== 'true'`: if `changes` itself fails its output
#       # is empty, and an empty output must RUN the tests, not skip them.
#       if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
#
# 🪤 Do NOT use `paths-ignore` on a workflow that produces a REQUIRED check: a
#    workflow that never starts leaves the check «Expected — waiting» forever and
#    the PR cannot merge. A job skipped by `if:` reports `skipped`, which branch
#    protection counts as passing. That is why this is a job, not a trigger filter.
#
# Fails OPEN everywhere: an event without a diff (workflow_dispatch,
# repository_dispatch, schedule), a new branch, a force-push, an API error, a
# diff over the compare API's 300-file cap, no previous successful run (with
# `since_last_success`), or a PR listing cut short by the
# files API's 3,000-file cap all answer `code=true`. A rename counts BOTH its
# paths: moving code into `docs/` still removes code.

name: changes

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels (the caller's private repo pays the minutes)
        type: string
        required: false
        default: '["self-hosted"]'
      code_regex:
        description: paths that count as code even when they look like docs
        type: string
        required: false
        default: ""
      since_last_success:
        description: >-
          On push, diff against the head of this workflow's last SUCCESSFUL push run on
          the branch (e.g. `ci-cd.yml`), not against the previous push. Use it for a
          deploy workflow with `cancel-in-progress`: otherwise a docs push that cancels
          a code deploy would skip, and the code would never deploy. Needs `actions: read`.
        type: string
        required: false
        default: ""
    outputs:
      code:
        description: "'true' when the change carries code (or when it could not tell)"
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Interval-Col/.github
          ref: main
          path: .changes-org
          sparse-checkout: scripts/changes_classify.py
          sparse-checkout-cone-mode: false

      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SINCE: ${{ inputs.since_last_success }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          : > files.txt
          ok=true
          case "$EVENT" in
            pull_request|pull_request_target)
              # Both sides of a rename: moving `src/x.py` to `docs/x.py` removes code.
              gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)' > files.txt || ok=false
              # The files endpoint stops at 3,000 files and still exits 0: a short
              # list could hide the one code file. Compare with the PR's own count.
              total=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files') || total=""
              listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | wc -l | tr -d ' ') || listed=""
              if [ -z "$total" ] || [ -z "$listed" ] || [ "$listed" -lt "$total" ]; then
                ok=false
              fi ;;
            push)
              if [ -n "$SINCE" ]; then
                # The last deploy that FINISHED green, not the previous push: a push
                # that was cancelled mid-deploy must not vanish from the diff.
                # Measured 2026-09-28: this listing is sometimes served STALE (an
                # older run). An older base only widens the diff, so it can only err
                # toward running — never toward skipping code.
                BEFORE=$(gh api "repos/$REPO/actions/workflows/$SINCE/runs?branch=$BRANCH&event=push&status=success&per_page=1" \
                         --jq '.workflow_runs[0].head_sha // empty') || BEFORE=""
                echo "base = last successful $SINCE run on $BRANCH: ${BEFORE:-none}"
              fi
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                ok=false   # new branch: no base to diff against
              else
                n=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files | length') || n=""
                if [ -z "$n" ] || [ "$n" -ge 300 ]; then
                  ok=false   # API error, force-push, or the 300-file compare cap
                else
                  gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                    --jq '.files[] | .filename, (.previous_filename // empty)' > files.txt || ok=false
                fi
              fi ;;
            *) ok=false ;;  # dispatch / schedule: no diff — run everything
          esac
          [ "$ok" = true ] || : > files.txt   # empty list ⇒ the classifier says code=true
          echo "event=$EVENT files=$(wc -l < files.txt | tr -d ' ') listed=$ok"

      - name: Classify
        id: classify
        env:
          CODE_REGEX: ${{ inputs.code_regex }}
        run: |
          set -euo pipefail
          python3 .changes-org/scripts/changes_classify.py --code-regex "$CODE_REGEX" \
            < files.txt | tee -a "$GITHUB_OUTPUT"
          if grep -q '^code=false' "$GITHUB_OUTPUT"; then
            echo "::notice title=Sólo documentación::Este cambio sólo toca documentación (*.md, docs/, plans/) — los tests, el build y el despliegue se saltan."
            { echo "### ⏭️ Sólo documentación"; echo; echo "Archivos:"; sed 's/^/- `/; s/$/`/' files.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
