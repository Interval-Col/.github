# Reusable: plan-standards conformance gate — schema v2.1 + plan-craft.
#
# Runs scripts/plan_lint.py (from THIS repo, @main) against the plan `.md`
# files a PR touches in the caller repo, and asserts the mechanical subset of
# the plan standard: frontmatter block present, the eight CI-checked v2.1 keys,
# the controlled `status` enum, retired keys, bilingual title, top Resumen.
# Authoring guidance lives in agents/plan-craft.agent.md; the canonical shape
# in templates/plan-template.md.
#
# Why this exists: the standard was documented, templated and given an agent
# file — but never gated, so it was skimmed. Ten registry validators guard CSS
# colors; none guarded the document that governs how the team works.
#
# Rollout (mirrors the db-tenant-check / gitleaks recipe): callers ship with
# enforce=false — drift annotates inline on the PR and never blocks. After one
# convergence cycle (backfill the repo's existing plans) the caller flips
# enforce=true and the check is marked required in branch protection.
# Never enforce before the first run is green.
#
# Promotion to org-wide `--strict` additionally waits on the status-enum ↔
# board-column reconciliation (Interval-Col/operations#38), which is what the
# `status` vocabulary here is checked against.
#
# Why the runner input: the org is on the Team plan with a $0 Actions spending
# limit, so private caller repos use the self-hosted pool (the default below).
# PUBLIC callers MUST pass runner '["ubuntu-latest"]' — the self-hosted pool
# excludes public repos and a self-hosted job there queues forever (bit us on
# PR #107). This repo's own plan-lint.yml is the public-caller case.
#
# No secrets needed: the check is pure static analysis of markdown.

name: plans-check

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        type: string
        required: false
        default: '["self-hosted"]'
      enforce:
        description: fail the check on plan-standard drift (required-check mode)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plans-check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: Interval-Col/.github
          ref: main
          path: .plans-org

      # On a pull_request the change set is the diff against the base branch.
      # On any other event (push, workflow_dispatch) there is no base_ref, so
      # fall back to every lintable plan in the tree — otherwise the check would
      # silently pass by finding nothing to look at.
      - name: Collect plan files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --quiet || true
            files=$(git diff --name-only --diff-filter=ACMR \
                      "origin/$BASE_REF"...HEAD -- '**/plans/**.md' || true)
            scope="changed in this PR vs origin/$BASE_REF"
          else
            files=$(git ls-files -- '**/plans/**.md' || true)
            scope="every tracked plan (no base ref on this event)"
          fi
          # plan_lint.py's is_lintable() also filters these; doing it here keeps
          # the log honest about what was actually considered.
          files=$(printf '%s\n' "$files" | grep -v '/archive/' | grep -v 'template' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Scope: $scope"
          echo "Plan files:"; echo "$files"

      - name: plan-lint
        if: steps.changed.outputs.files != ''
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ENFORCE" = "true" ]; then args+=(--strict); fi
          # shellcheck disable=SC2086
          python3 .plans-org/scripts/plan_lint.py "${args[@]}" ${{ steps.changed.outputs.files }}
