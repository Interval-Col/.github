# Reusable: plan-standards conformance gate — schema v2.1 + plan-craft.
#
# Runs scripts/plan_lint.py (from THIS repo, @main) against the plan `.md`
# files a PR touches in the caller repo, and asserts the mechanical subset of
# the plan standard: frontmatter block present, the eight CI-checked v2.1 keys,
# the controlled `status` enum, retired keys, bilingual title, top Resumen.
# Authoring guidance lives in agents/plan-craft.agent.md; the canonical shape
# in templates/plan-template.md.
#
# Why this exists: the standard was documented, templated and given an agent
# file — but never gated, so it was skimmed. Ten registry validators guard CSS
# colors; none guarded the document that governs how the team works.
#
# Rollout (mirrors the db-tenant-check / gitleaks recipe): callers ship with
# enforce=false — drift annotates inline on the PR and never blocks. After one
# convergence cycle (backfill the repo's existing plans) the caller flips
# enforce=true and the check is marked required in branch protection.
# Never enforce before the first run is green.
#
# Promotion to org-wide `--strict` additionally waits on the status-enum ↔
# board-column reconciliation (Interval-Col/operations#38), which is what the
# `status` vocabulary here is checked against.
#
# Why the runner input: the org is on the Team plan with a $0 Actions spending
# limit, so private caller repos use the self-hosted pool (the default below).
# PUBLIC callers MUST pass runner '["ubuntu-latest"]' — the self-hosted pool
# excludes public repos and a self-hosted job there queues forever (bit us on
# PR #107). This repo's own plan-lint.yml is the public-caller case.
#
# No secrets needed: the check is pure static analysis of markdown.

name: plans-check

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        type: string
        required: false
        default: '["self-hosted"]'
      enforce:
        description: fail the check on plan-standard drift (required-check mode)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plans-check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: Interval-Col/.github
          ref: main
          path: .plans-org

      # On a pull_request the change set is the diff against the base branch.
      # On any other event (push, workflow_dispatch) there is no base_ref, so
      # fall back to every lintable plan in the tree — otherwise the check would
      # silently pass by finding nothing to look at.
      - name: Collect plan files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # TWO pathspecs, and both are load-bearing. In git, `**/plans/**.md`
          # requires AT LEAST ONE directory before `plans/`, so it matches the
          # monorepo shape (`lab-qc/plans/x.md`, `apps/lch-results/plans/x.md`)
          # and MISSES a repo whose plans live at the root (`plans/x.md`) — which
          # is 8 of the 10 callers, ~81 plan files, including this gate's own
          # home for `operations`. The check went green on them by finding
          # nothing to look at: `plan-lint` step `skipped`, job `success`
          # (operations#338 and #335, both of which DID edit a plan).
          #
          # It shipped that way because it was exercised in the two repos where
          # the glob works — pharos-lis#242 and public-web#141, the runs cited
          # above — and the majority shape was never run.
          PLAN_GLOBS=('plans/**.md' '**/plans/**.md')
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --quiet || true
            files=$(git diff --name-only --diff-filter=ACMR \
                      "origin/$BASE_REF"...HEAD -- "${PLAN_GLOBS[@]}" || true)
            scope="changed in this PR vs origin/$BASE_REF"
          else
            files=$(git ls-files -- "${PLAN_GLOBS[@]}" || true)
            scope="every tracked plan (no base ref on this event)"
          fi
          # A repo with plans in BOTH shapes would match a file under each glob;
          # git already de-duplicates across pathspecs, but sort -u makes that a
          # property of this script rather than of git's current behaviour.
          files=$(printf '%s\n' "$files" | sort -u | grep -v '^$' || true)
          # plan_lint.py's is_lintable() also filters these; doing it here keeps
          # the log honest about what was actually considered.
          files=$(printf '%s\n' "$files" | grep -v '/archive/' | grep -v 'template' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Scope: $scope"
          echo "Plan files:"; echo "$files"

          # Red de seguridad contra ESTE mismo bug. Un gate que no encuentra
          # nada es indistinguible de un gate que no tenía nada que mirar: en
          # ambos casos el paso se salta y el job sale verde. Así vivió el glob
          # roto sin que nadie lo notara. Esto compara lo que los globs
          # capturaron contra lo que el PR tocó de verdad bajo cualquier
          # `plans/`, y si sobra algo lo dice en voz alta. Es un aviso, no un
          # fallo: la lista de abajo puede ser legítimamente más corta (archive,
          # templates), pero un hueco por pathspec queda visible en el log.
          if [ -n "$BASE_REF" ]; then
            touched=$(git diff --name-only --diff-filter=ACMR \
                        "origin/$BASE_REF"...HEAD \
                      | grep -E '(^|/)plans/.*\.md$' \
                      | grep -v '/archive/' | grep -v 'template' || true)
            missed=$(comm -23 <(printf '%s\n' "$touched" | sort -u | grep -v '^$') \
                              <(printf '%s\n' "$files"   | sort -u | grep -v '^$') || true)
            if [ -n "$missed" ]; then
              echo "::warning::plan(es) bajo plans/ que el pathspec NO capturó — el gate estaría mirando de menos:"
              printf '%s\n' "$missed" | sed 's/^/::warning::  · /'
            fi
          fi

      # The file list crosses into the shell through the ENVIRONMENT, never through
      # `${{ }}` interpolation. Interpolating it inline splices the value into the
      # script as raw text: a multi-line list becomes multiple SHELL LINES, so the
      # linter received only the first path and bash tried to EXECUTE the rest as
      # commands (exit 126, "1 plan file(s) checked" on a 15-file PR — pharos-lis#242
      # and public-web#141, 2026-08-07). It is also an injection hole: a crafted
      # branch or file name would run arbitrary shell on the runner.
      - name: plan-lint
        if: steps.changed.outputs.files != ''
        env:
          ENFORCE: ${{ inputs.enforce }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ENFORCE" = "true" ]; then args+=(--strict); fi
          # `while read` rather than `mapfile`: same result, and it runs on any bash,
          # so it can be exercised outside the runner before shipping.
          paths=()
          while IFS= read -r p; do [ -n "$p" ] && paths+=("$p"); done <<< "$FILES"
          echo "Linting ${#paths[@]} plan file(s)."
          python3 .plans-org/scripts/plan_lint.py "${args[@]}" "${paths[@]}"
