# This repo's own caller for the reusable `plans-check` gate — and the
# reference stub every other repo copies.
#
# Runner: THIS repo is public → hosted minutes are free AND the org's
# self-hosted pool excludes public repos (a self-hosted job here queues
# forever — bit us on PR #107). So this caller passes ubuntu-latest.
# PRIVATE callers omit `runner` and take the '["self-hosted"]' default: the
# org is on the Team plan with a $0 Actions spending limit, so a hosted
# required check there risks tipping the cap and killing all runs.
#
# `enforce: false` — findings annotate inline and never block. A repo flips it
# to true after backfilling its existing plans and seeing one green run, then
# marks the check required in branch protection. Org-wide `--strict` also
# waits on Interval-Col/operations#38 (the status-enum ↔ board-column vocab).
#
# Deliberately NO `paths:` filter. A paths-filtered workflow never reports its
# context on PRs that miss the filter, so the moment it became a required
# check it would hang every unrelated PR on "Expected — waiting for status".
# The gate is cheap and exits OK when the change set touches no plans.

name: Plan standards (advisory)

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan-lint:
    uses: ./.github/workflows/plans-check.yml
    with:
      runner: '["ubuntu-latest"]'
      enforce: false
