# Reusable: el contrato de cada repo — AGENTS.md en la raíz + CLAUDE.md que lo importa
# (RFC 0039 D4; plan del arnés, tarea 3.2).
#
# Por qué existe: las sesiones arrancan en ~/dev, y ~/dev/CLAUDE.md (el mapa) apaga la
# lectura nativa de AGENTS.md para todos los repos de abajo. Sin la línea `@AGENTS.md`
# en el CLAUDE.md del repo, su conocimiento nunca carga. Y un AGENTS.md de 1.500 líneas
# (biuman-lis) se paga en cada sesión que lo toca: el presupuesto es 200.
#
# Reporta missing / over-budget / conformant. Nació en MODO AVISO con fecha de
# promoción (RFC 0029) y desde el 2026-11-10 es OBLIGATORIO (tarea 3.9): `enforce`
# vale `true` por defecto, así que ningún caller tiene que cambiar. Un caller que
# necesite volver a aviso pasa `enforce: false` **con** `review_by: AAAA-MM-DD`
# (RFC 0029: todo perfil rebajado lleva fecha de revisión). Sin fecha, o con la fecha
# vencida, el check falla: una rebaja no puede quedarse para siempre sin que nadie la mire.
#
# Runner: como plans-check, los repos privados usan el pool self-hosted (por defecto);
# un caller PÚBLICO tiene que pasar runner '["ubuntu-latest"]' o se queda en cola.

name: agents-md-check

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        type: string
        required: false
        default: '["self-hosted"]'
      enforce:
        description: fail the check when the repo does not conform (required-check mode)
        type: boolean
        required: false
        default: true
      review_by:
        description: with enforce=false, the date (YYYY-MM-DD) the downgrade must be reviewed by (RFC 0029)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  agents-md-check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      # Dentro del propio .github el script se toma del checkout del PR: tomado de
      # `main`, el PR que lo introduce (o lo cambia) se mediría con la versión vieja.
      - uses: actions/checkout@v7
        if: github.repository != 'Interval-Col/.github'
        with:
          repository: Interval-Col/.github
          ref: main
          path: .agents-md-org
      - name: La rebaja lleva fecha de revisión (RFC 0029)
        if: ${{ !inputs.enforce }}
        env:
          REVIEW_BY: ${{ inputs.review_by }}
        run: |
          if ! [[ "$REVIEW_BY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error title=agents-md-check::enforce: false necesita review_by: AAAA-MM-DD (RFC 0029)"; exit 1
          fi
          if [[ "$REVIEW_BY" < "$(date -u +%F)" ]]; then
            echo "::error title=agents-md-check::la rebaja a aviso venció el $REVIEW_BY: revísala (RFC 0029)"; exit 1
          fi
          echo "rebaja a aviso hasta el $REVIEW_BY"
      - name: AGENTS.md + shim
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          S=.agents-md-org/scripts/agents_md_check.py
          [ "$GITHUB_REPOSITORY" = "Interval-Col/.github" ] && S=scripts/agents_md_check.py
          python3 "$S" . $([ "$ENFORCE" = "true" ] && echo --enforce)
